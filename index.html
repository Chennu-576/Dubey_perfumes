    <script id="statsAnimator">
      // Standalone & synchronized stat counter animator (moves up & stops at target numbers ONCE ONLY)
      (function() {
        var targets = [
          { target: 500, suffix: '+', text: '500+' },
          { target: 50, suffix: 'K+', text: '50K+' },
          { target: 10, suffix: '+', text: '10+' },
          { target: 20, suffix: '+', text: '20+' }
        ];
        var isRunning = false;
        var hasRun = false;

        function getStatsEl() {
          return document.getElementById('about-stats');
        }

        function triggerCounter() {
          if (isRunning || hasRun || window.__dubeyStatsAnimated) return;
          var container = getStatsEl();
          if (!container) return;
          if (document.body.classList.contains('gate-lock')) return;

          var items = container.querySelectorAll('.about-stat-item');
          if (!items || items.length < 4) return;

          isRunning = true;
          hasRun = true;
          window.__dubeyStatsAnimated = true;
          var duration = 1200;
          var startTime = null;

          function frame(now) {
            if (!startTime) startTime = now;
            var elapsed = now - startTime;
            var progress = Math.min(elapsed / duration, 1);
            var ease = 1 - Math.pow(1 - progress, 3);

            for (var k = 0; k < items.length; k++) {
              var cfg = targets[k];
              if (!cfg) continue;
              var numEl = items[k].querySelector('.about-stat-num') || items[k].firstElementChild;
              if (numEl) {
                var val = Math.round(cfg.target * ease);
                numEl.textContent = val + cfg.suffix;
                var transY = ((1 - ease) * 16).toFixed(1);
                var opac = (0.2 + 0.8 * ease).toFixed(2);
                numEl.style.transform = 'translateY(' + transY + 'px)';
                numEl.style.opacity = opac;
                numEl.style.display = 'inline-block';
              }
            }

            if (progress < 1) {
              requestAnimationFrame(frame);
            } else {
              isRunning = false;
              for (var j = 0; j < items.length; j++) {
                var c = targets[j];
                if (!c) continue;
                var el = items[j].querySelector('.about-stat-num') || items[j].firstElementChild;
                if (el) {
                  el.textContent = c.text;
                  el.style.transform = 'translateY(0)';
                  el.style.opacity = '1';
                }
              }
            }
          }

          requestAnimationFrame(frame);
        }

        function init() {
          var container = getStatsEl();
          if (!container) {
            setTimeout(init, 100);
            return;
          }

          if (window.__dubeyStatsAnimated) {
            return;
          }

          if ('IntersectionObserver' in window) {
            var obs = new IntersectionObserver(function(entries) {
              entries.forEach(function(entry) {
                if (entry.isIntersecting && !hasRun && !window.__dubeyStatsAnimated) {
                  triggerCounter();
                  obs.unobserve(container);
                  obs.disconnect();
                }
              });
            }, { threshold: 0.1, rootMargin: '0px 0px -20px 0px' });
            obs.observe(container);
          }

          var gateBtn = document.getElementById('gateBtn');
          if (gateBtn) {
            gateBtn.addEventListener('click', function() {
              setTimeout(function() {
                var c = getStatsEl();
                if (c && !hasRun && !window.__dubeyStatsAnimated) {
                  var r = c.getBoundingClientRect();
                  if (r.top < window.innerHeight && r.bottom > 0) {
                    triggerCounter();
                  }
                }
              }, 400);
            });
          }

          window.addEventListener('scroll', function() {
            if (!isRunning && !hasRun && !window.__dubeyStatsAnimated && !document.body.classList.contains('gate-lock')) {
              var c = getStatsEl();
              if (c) {
                var r = c.getBoundingClientRect();
                if (r.top < window.innerHeight - 30 && r.bottom > 30) {
                  triggerCounter();
                }
              }
            }
          }, { passive: true });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', init);
        } else {
          init();
        }
      })();
    </script>
